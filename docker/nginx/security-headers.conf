# Cabecalhos de seguranca (incluido ao nivel do server E em cada location que
# use add_header, porque o nginx nao herda add_header quando a location define
# os seus proprios).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# A SPA so carrega recursos do proprio dominio. 'unsafe-inline' em style-src e
# necessario para os <style> injectados pelos componentes Radix (scroll lock).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
