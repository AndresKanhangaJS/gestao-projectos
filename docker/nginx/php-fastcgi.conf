# Encaminha o pedido para o front controller do Laravel (contentor app, php-fpm).
# Nao se usa try_files: o nginx nao tem o codigo PHP, so o SPA estatico.
fastcgi_pass app:9000;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /var/www/html/public;
# $app_https e definido por prod.conf (TLS aqui) ou prod-behind-proxy.conf (X-Forwarded-Proto).
fastcgi_param HTTPS $app_https if_not_empty;
# Mitigacao "httpoxy".
fastcgi_param HTTP_PROXY "";
fastcgi_read_timeout 300;
fastcgi_buffer_size 32k;
fastcgi_buffers 16 16k;
