# nginx de producao com TLS terminado aqui.
# Certificados montados de ./docker/nginx/certs (fullchain.pem e privkey.pem).
# Se o servidor estiver atras de um reverse proxy que ja termina TLS, usar
# prod-behind-proxy.conf (ver docs/DEPLOY.md).

map $scheme $app_https {
    https   on;
    default "";
}

# HTTP: redirecciona tudo para HTTPS, excepto o healthcheck local do contentor.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location = /up {
        allow 127.0.0.1;
        deny all;
        include /etc/nginx/snippets/php-fastcgi.conf;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/spa.conf;
}
