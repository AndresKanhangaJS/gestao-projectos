server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    root /var/www/html/public;

    # API Laravel (Sanctum SPA) - despacha directamente para o front controller
    # do Laravel via PHP-FPM. Não se usa try_files aqui: um redireccionamento
    # interno para /index.php perderia o prefixo (api|sanctum|up) e cairia,
    # por engano, na location "/" (proxy para o frontend).
    location ~ ^/(api|sanctum|up)(/|$) {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 300;
    }

    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
    }

    # Frontend (Vite dev server) - HMR websocket incluido
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
