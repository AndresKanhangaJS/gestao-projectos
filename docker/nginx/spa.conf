# Conteudo comum do server de producao (TLS directo ou atras de reverse proxy).

server_tokens off;
charset utf-8;

# Anexos de tarefas: maximo 10 MB na validacao da API (StoreTaskAttachmentRequest);
# 25M acompanha upload_max_filesize/post_max_size do docker/php/php.ini.
client_max_body_size 25M;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

root /usr/share/nginx/html;
index index.html;

include /etc/nginx/snippets/security-headers.conf;

# Ficheiros ocultos (.env, .git, .htaccess, ...): nunca servidos.
location ~ /\.(?!well-known/) {
    deny all;
}

# API Laravel, Sanctum (csrf-cookie) e healthcheck.
location ~ ^/(api|sanctum|up)(/|$) {
    include /etc/nginx/snippets/php-fastcgi.conf;
}

# Os anexos estao no disco privado (storage/app/private) e so saem pelo
# endpoint autenticado da API. O disco "public" nao e usado: /storage nao e servido.
location ^~ /storage/ {
    return 404;
}

# Assets do Vite com hash no nome: cache longa.
location ^~ /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# index.html nunca em cache (para apanhar logo uma nova versao).
location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# Fallback SPA: rotas do React Router devolvem index.html.
location / {
    try_files $uri /index.html;
}
