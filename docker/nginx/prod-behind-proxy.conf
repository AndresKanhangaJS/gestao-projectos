# Variante para quando o servidor esta atras de um reverse proxy (ou balanceador)
# que JA termina o TLS e encaminha em HTTP para este nginx na porta 80.
# Activar montando este ficheiro por cima do default.conf da imagem web
# (ver docker-compose.prod.yml e docs/DEPLOY.md).
#
# O proxy tem de enviar: Host original, X-Forwarded-Proto: https e X-Forwarded-For.

# Laravel ve o pedido como HTTPS quando o proxy o indica.
map $http_x_forwarded_proto $app_https {
    https   on;
    default "";
}

server {
    listen 80 default_server;
    server_name _;

    # IP real do cliente (usado pelo throttle de login e pelos registos).
    # AJUSTAR para o IP/rede do reverse proxy; nao confiar em redes mais largas do que o necessario.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/snippets/spa.conf;
}
