; Afinacao de producao (apenas na imagem "production" do docker/php/Dockerfile).
; Carregado depois de 99-app.ini, por isso sobrepoe os valores de desenvolvimento.

; O codigo nao muda dentro do contentor: nao verificar timestamps.
; Uma nova versao implica novo build da imagem e novo contentor.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
