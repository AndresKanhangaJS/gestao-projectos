; Pool www em producao (sobrepoe /usr/local/etc/php-fpm.d/www.conf).
[www]
; Endpoint de ping usado pelo healthcheck do contentor (cgi-fcgi em 127.0.0.1:9000).
; O nginx envia sempre SCRIPT_NAME=/index.php, por isso /ping nao e acessivel de fora.
ping.path = /ping
ping.response = pong

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Passar as variaveis de ambiente do contentor (APP_*, DB_*, ...) aos workers PHP.
clear_env = no
